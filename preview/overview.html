<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>映你 · 界面总览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e9ede6;color:#283a30;font-family:"Microsoft YaHei",sans-serif}.wrap{max-width:1580px;margin:auto;padding:42px 28px 64px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:30px}h1{font-size:28px;margin:8px 0}header p{font-size:14px;line-height:1.7;color:#718074;margin:0}.tag{color:#839c80;font-size:11px;letter-spacing:.15em}.full{display:inline-block;color:#fff;background:#789777;text-decoration:none;padding:12px 18px;border-radius:24px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:22px}.label{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:14px}.number{font-size:11px;color:#88a084;letter-spacing:.1em}.device{height:790px;background:#f8f7f2;border:8px solid #34463b;border-radius:30px;overflow:hidden;box-shadow:0 12px 35px #334c3022}.device iframe{width:100%;height:100%;border:0}.caption{font-size:12px;color:#839086;line-height:1.7;margin:12px 2px}@media(max-width:1200px){.grid{grid-template-columns:repeat(2,minmax(260px,1fr))}}@media(max-width:620px){.wrap{padding:28px 18px}.grid{grid-template-columns:1fr}.device{height:760px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div><span class="tag">YINGNI / INTERFACE PREVIEW</span><h1>映你，界面总览</h1><p>从模式选择到聊天与创作，四个页面可以直接操作。所有内容仅用于界面演示。</p></div><a class="full" href="index.html">打开完整手机预览 ↗</a></header>
    <div class="grid">
      <section><h2 class="label"><span class="number">01</span> 模式选择</h2><div class="device"><iframe src="index.html#home" title="模式选择页面"></iframe></div><p class="caption">打开 App 后，选择聊天模式或其他模式。</p></section>
      <section><h2 class="label"><span class="number">02</span> 和诺诺聊天</h2><div class="device"><iframe src="index.html#chat" title="诺诺聊天页面"></iframe></div><p class="caption">查看聊天布局，可以输入消息体验界面。</p></section>
      <section><h2 class="label"><span class="number">03</span> 其他模式</h2><div class="device"><iframe src="index.html#explore" title="其他模式页面"></iframe></div><p class="caption">其他模式的功能入口，首版展示图片故事。</p></section>
      <section><h2 class="label"><span class="number">04</span> 图片创作</h2><div class="device"><iframe src="index.html#create" title="图片创作页面"></iframe></div><p class="caption">选择画风、参考图和数量，体验示例生成流程。</p></section>
    </div>
  </main>
</body>
</html>
